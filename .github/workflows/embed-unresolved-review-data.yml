name: Embed unresolved review data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/embed_unresolved_review_data.py'
      - 'data/unresolved-review-1453.json'
      - '.github/workflows/embed-unresolved-review-data.yml'
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Embed 1453 records into HTML
        run: python scripts/embed_unresolved_review_data.py
      - name: Commit embedded page
        run: |
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add eksik-veriler.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: embed 1453 unresolved records into review page"
          git pull --rebase origin main
          git push origin main
