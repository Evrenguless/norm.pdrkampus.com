name: Layered student-count rescue

on:
  push:
    branches:
      - fix-layered-kindergarten-targets
    paths:
      - "scripts/layered_student_rescue.py"
      - ".github/workflows/layered-student-rescue.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run exact unresolved kindergarten rescue
        env:
          TARGET_GROUP: kindergarten
        run: python scripts/layered_student_rescue.py
      - name: Commit accepted values and candidates
        run: |
          if [ -z "$(git status --porcelain -- data/student-overrides.json data/layered-rescue-summary.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/student-overrides.json data/layered-rescue-summary.json
          git commit -m "data: rescue remaining kindergarten counts"
          git push
