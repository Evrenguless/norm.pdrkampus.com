name: Audit preschool missing data

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_preschool_missing.py"
      - "scripts/audit_preschool_js.mjs"
      - ".github/workflows/audit-preschool-missing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit remaining preschool rows
        run: python scripts/audit_preschool_missing.py
      - name: Reproduce homepage preschool calculation
        run: node scripts/audit_preschool_js.mjs
      - name: Commit audit reports
        run: |
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/preschool-missing-audit.json data/preschool-js-audit.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: audit remaining preschool missing rows"
          git push
