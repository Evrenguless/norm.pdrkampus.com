name: Final UI polish

on:
  push:
    branches: [main]
    paths:
      - "scripts/final_ui_polish.py"
      - ".github/workflows/final-ui-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final publication polish
        run: python scripts/final_ui_polish.py
      - name: Commit polished homepage
        run: |
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "ui: polish final publication homepage"
          git push
