name: Final UI polish

on:
  push:
    branches: [main]
    paths:
      - "scripts/final_ui_polish.py"
      - "scripts/compact_results_view.py"
      - "scripts/add_results_cards.py"
      - "scripts/final_table_density_cleanup.py"
      - "scripts/add_private_school_scope_note.py"
      - "scripts/add_zero_norm_breakdown.py"
      - "scripts/dashboard_redesign_v2.py"
      - "scripts/table_readability_v3.py"
      - "scripts/table_layout_v3.py"
      - "scripts/table_alignment_v4.py"
      - ".github/workflows/final-ui-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final publication polish
        run: python scripts/final_ui_polish.py
      - name: Apply compact full-screen results view
        run: python scripts/compact_results_view.py
      - name: Add filter-aware results summary cards
        run: python scripts/add_results_cards.py
      - name: Densify table and remove source links
        run: python scripts/final_table_density_cleanup.py
      - name: Add private school scope note
        run: python scripts/add_private_school_scope_note.py
      - name: Add zero-norm threshold breakdown
        run: python scripts/add_zero_norm_breakdown.py
      - name: Apply dashboard hierarchy redesign
        run: python scripts/dashboard_redesign_v2.py
      - name: Apply page-scrolling readable table
        run: python scripts/table_readability_v3.py
      - name: Apply centered readable table layout
        run: python scripts/table_layout_v3.py
      - name: Fix exact table column alignment
        run: python scripts/table_alignment_v4.py
      - name: Commit polished homepage
        run: |
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "ui: fix table column alignment"
          git push
