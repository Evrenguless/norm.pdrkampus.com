name: Four-pass all-missing school scan

on:
  push:
    branches:
      - all-schools-four-pass
    paths:
      - "scripts/four_pass_all_missing_v2.py"
      - "scripts/four_pass_all_missing_v3.py"
      - ".github/workflows/four-pass-all-missing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pypdf
      - name: Run broad-scope four-pass scan over every missing school
        env:
          WORKERS: "24"
        run: python scripts/four_pass_all_missing_v3.py
      - name: Commit verified results and final audit report
        run: |
          if [ -z "$(git status --porcelain -- data/student-overrides.json data/four-pass-all-missing-summary.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/student-overrides.json data/four-pass-all-missing-summary.json
          git commit -m "data: complete broad-scope four-pass scan for all missing schools"
          git push
