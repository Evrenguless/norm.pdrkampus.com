name: Add manual student count editor
on:
  push:
    paths:
      - '.github/workflows/add-manual-student-inputs.yml'
      - 'scripts/add_manual_student_inputs.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add manual inputs
        run: python scripts/add_manual_student_inputs.py
      - name: Validate page JavaScript and controls
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('eksik-veriler.html').read_text(encoding='utf-8')
          assert 'class="manualinput"' in s
          assert 'id="exportManual"' in s
          assert 'MANUAL_KEY' in s
          a=s.find('<script>'); b=s.rfind('</script>')
          assert a>=0 and b>a
          Path('/tmp/review.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/review.js
      - name: Commit page
        run: |
          git config user.name 'pdrkampus-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add eksik-veriler.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add manual student count inputs to unresolved schools'
          git push origin HEAD:main
