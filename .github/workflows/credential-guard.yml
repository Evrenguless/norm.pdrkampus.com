name: Credential Guard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test redaction, JWT roles and environment file handling
        run: python -m unittest discover -s scripts -p 'test_secret_guard.py'
      - name: Reject private credentials and tracked environment files
        run: python scripts/secret_guard.py
