name: One-off current PDR norm rules migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-pdr-norm-rules
          fetch-depth: 0
      - name: Update norm rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          s = s.replace("Bu sayfa bir karar/atama sistemi değildir. Hesaplama, veri setindeki alanlar ve Madde 21'in kullanıcı tarafından sağlanan hükümleri esas alınarak yapılır.", "Bu sayfa bir karar/atama sistemi değildir. Hesaplama, veri setindeki alanlar ve Madde 21'in güncel birleşik metnindeki eşikler esas alınarak yapılır.")

          new_method = '''<section class="method-summary"><div><span class="section-kicker">MADDE 21</span><h2>Hangi eşikler uygulanıyor?</h2></div><div class="rules-grid"><article><b>Anaokulu</b><strong>150+</strong><p>İlk norm; 500 ve katlarında her defasında +1.</p></article><article><b>İlkokul</b><strong>300+</strong><p>İlk norm; 500 ve katlarında her defasında +1.</p></article><article><b>Ortaokul / İHO / Ortaöğretim</b><strong>150+</strong><p>İlk norm; 500 ve katlarında her defasında +1.</p></article><article><b>Özel eğitim</b><strong>25+</strong><p>İlk norm; 100 ve katlarında her defasında +1.</p></article><article><b>Meslekî eğitim merkezi</b><strong>200+</strong><p>Çırak/kursiyer sayısı esas alınır; 500 ve katlarında ilave norm oluşur.</p></article><article><b>RAM</b><strong>Nüfus</strong><p>100 bine kadar 4; sonraki her 50 bin için +1, en az 25 bin artan nüfusta ayrıca +1.</p></article></div></section>'''
          s, n = re.subn(r'<section class="method-summary">.*?</section>', new_method, s, count=1, flags=re.S)
          assert n == 1, 'method summary not found'

          new_dialog = '<p><b>Temel hesap:</b> Anaokullarında 150+, ilkokullarda 300+, ortaokul/İHO ve ortaöğretimde 150+, özel eğitim kurumlarında 25+, meslekî eğitim merkezlerinde 200+ eşiği uygulanır. Özel eğitim kurumlarında her 100, diğer kapsamdaki eğitim kurumlarında ise her 500 öğrenci/çırak sayısına ulaşıldığında ilave 1 norm hesaplanır.</p>'
          s, n = re.subn(r'<p><b>Temel hesap:</b>.*?</p>', new_dialog, s, count=1, flags=re.S)
          assert n == 1, 'dialog rule paragraph not found'

          new_norm = r'''function normFor(r){const t=r.okul_turu||"",name=trLower(r.okul_adi),tl=trLower(t),si=studentInfo(r),n=si.value;const policy=institutionPolicy(r);if(policy==="outside")return {norm:null,status:"Analiz kapsamı dışı",reason:"Bu kayıt okul öğrenci-norm analizinin dışında tutulur. Bu sınıflandırma rehber öğretmen atanamayacağı anlamına gelmez."};if(policy==="ministerial")return {norm:null,status:"Bakanlıkça belirlenir",reason:"Madde 23 kapsamında norm kadro Bakanlıkça ayrıca belirlenir; öğrenci sayısına dayalı Madde 21 formülü uygulanmaz."};const boarding=["yatılı","pansiyonlu","pansiyon"].some(k=>name.includes(k)||tl.includes(k));const special=t==="Özel Eğitim Kurumu"||tl.includes("özel eğitim");if(t==="Rehberlik ve Araştırma Merkezi"||tl.includes("rehberlik ve araştırma"))return {norm:null,status:"Ek veri gerekli",reason:"RAM normu için il/ilçe nüfus verisi gerekir (21/1)."};if(t==="Anaokulu"||tl.includes("anaokulu")||tl.includes("ana okulu")){if(n===null)return boarding?{norm:1,status:"Kısmi hesap",reason:"Yatılı/pansiyonlu işaretinden en az 1; öğrenci sayısı eksik."}:{norm:null,status:"Ek veri gerekli",reason:"Anaokulu için öğrenci sayısı eksik."};const v=Math.max((n>=150?1:0)+Math.floor(n/500),boarding?1:0);return {norm:v,status:"Hesaplandı",reason:`Anaokulu: ${fmt(n)} öğrenci; 150+ için 1, her 500 ve katında +1 (21/2-b, 21/3).`};}if(special){if(n===null)return boarding?{norm:1,status:"Kısmi hesap",reason:"Yatılı/pansiyonlu işaretinden en az 1; öğrenci sayısı eksik."}:{norm:null,status:"Ek veri gerekli",reason:"Özel eğitim kurumu için öğrenci sayısı eksik."};const v=Math.max((n>=25?1:0)+Math.floor(n/100),boarding?1:0);return {norm:v,status:"Hesaplandı",reason:`Özel eğitim: ${fmt(n)} öğrenci; 25+ için 1, her 100 ve katında +1 (21/2-a, 21/3). Ortak bina/bahçe kontrolü veri setinden yapılamıyor.`};}if(t==="İlkokul"){if(n===null)return boarding?{norm:1,status:"Kısmi hesap",reason:"Yatılı/pansiyonlu işaretinden en az 1; öğrenci sayısı eksik."}:{norm:null,status:"Ek veri gerekli",reason:"İlkokul için öğrenci sayısı eksik."};const v=Math.max((n>=300?1:0)+Math.floor(n/500),boarding?1:0);return {norm:v,status:"Hesaplandı",reason:`İlkokul: ${fmt(n)} öğrenci; 300+ için 1, her 500 ve katında +1. 21/2-d ilçe merkezi istisnası veri yokluğu nedeniyle eklenmedi.`};}if(middleTypes.has(t)||secondaryTypes.has(t)){if(n===null)return boarding?{norm:1,status:"Kısmi hesap",reason:"Yatılı/pansiyonlu işaretinden en az 1; öğrenci sayısı eksik."}:{norm:null,status:"Ek veri gerekli",reason:"Bu kurum için öğrenci sayısı eksik."};const v=Math.max((n>=150?1:0)+Math.floor(n/500),boarding?1:0);return {norm:v,status:"Hesaplandı",reason:`${middleTypes.has(t)?"Ortaokul/İHO":"Ortaöğretim"}: ${fmt(n)} öğrenci; 150+ için 1, her 500 ve katında +1. 21/2-d gerekiyorsa ilçe merkezi verisi ayrıca gerekir.`};}if(t==="Mesleki Eğitim Merkezi"||t==="Meslekî Eğitim Merkezi"||tl.includes("mesleki eğitim merkezi")||tl.includes("meslekî eğitim merkezi")){if(n===null)return {norm:null,status:"Ek veri gerekli",reason:"Meslekî eğitim merkezi için çırak/kursiyer sayısı yerine kullanılabilecek öğrenci verisi eksik."};const v=Math.max((n>=200?1:0)+Math.floor(n/500),boarding?1:0);return {norm:v,status:"Kısmi hesap",reason:`Madde 21/2-e çırak/kursiyer sayısını esas alır. Dosyadaki ${fmt(n)} öğrenci sayısı yalnızca vekil olarak kullanıldı; 200+ için 1, her 500 ve katında +1. Kesin norm için gerçek çırak/kursiyer sayısı doğrulanmalıdır.`};}if(boarding){if(n===null)return {norm:1,status:"Kısmi hesap",reason:"Yatılı/pansiyonlu işaretinden en az 1 norm; öğrenci sayısı eksik."};return {norm:1+Math.floor(n/500),status:"Hesaplandı",reason:`Yatılı/pansiyonlu işaretinden en az 1 norm (21/2-ç); 500'lük artışlar ayrıca uygulandı.`};}return {norm:0,status:"Hesaplandı",reason:"Bu kurum türü Madde 21/2'de rehberlik alanı için öğrenci/çırak sayısına bağlı norm verilen kurumlar arasında sayılmıyor; yatılı/pansiyonlu işareti de yok."};}'''
          s, n = re.subn(r'function normFor\(r\)\{.*?\}\nfunction fmt', new_norm + '\nfunction fmt', s, count=1, flags=re.S)
          assert n == 1, 'normFor function not found'
          assert 'Normal anaokulları öğrenci sayısına bağlı rehberlik normunun dışındadır' not in s
          assert '<b>Anaokulu</b><strong>150+</strong>' in s
          assert 'Anaokulu: ${fmt(n)} öğrenci; 150+ için 1' in s
          path.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Update PDR norm rules to current Article 21"
          git push origin HEAD:fix/current-pdr-norm-rules
