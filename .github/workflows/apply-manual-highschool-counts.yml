name: Apply manual high-school counts

on:
  push:
    branches: [main]
    paths:
      - "data/manual-student-counts-lise-2026-10-03.json"
      - "scripts/apply_manual_highschool_counts.py"
      - ".github/workflows/apply-manual-highschool-counts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply high-school manual review
        run: python scripts/apply_manual_highschool_counts.py
      - name: Commit updated data and UI
        run: |
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/student-overrides.json data/manual-highschool-summary.json index.html eksik-veriler.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: apply manual high-school review"
          git pull --rebase origin main
          git push
