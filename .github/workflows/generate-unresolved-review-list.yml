name: Generate unresolved review list
on:
  push:
    branches: [group-run37121325865-snapshot]
    paths:
      - 'scripts/generate_unresolved_review_list.py'
      - '.github/workflows/generate-unresolved-review-list.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact 1453 review list
        run: python scripts/generate_unresolved_review_list.py
      - name: Commit generated review data
        run: |
          git config user.name 'pdrkampus-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/unresolved-review-1453.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: add exact 1453 unresolved review records'
          git push
