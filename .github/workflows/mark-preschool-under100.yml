name: Mark remaining preschools under 100

on:
  push:
    branches: [main]
    paths:
      - "scripts/mark_remaining_preschool_under100.py"
      - ".github/workflows/mark-preschool-under100.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark-under100:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mark remaining preschools under 100
        run: python scripts/mark_remaining_preschool_under100.py
      - name: Commit updated overrides
        run: |
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/student-overrides.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: mark remaining preschools under 100"
          git push
