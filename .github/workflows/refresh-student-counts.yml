name: Refresh student counts

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 0"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_student_counts.py"
      - ".github/workflows/refresh-student-counts.yml"

permissions:
  contents: write

concurrency:
  group: refresh-student-counts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Deep re-scan unresolved normal schools
        run: python scripts/refresh_student_counts.py
      - name: Commit verified updates and scan summary
        run: |
          if [ -z "$(git status --porcelain -- data/student-overrides.json data/student-scan-summary.json)" ]; then
            echo "No student-count changes."
            exit 0
          fi
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/student-overrides.json data/student-scan-summary.json
          git commit -m "data: refresh verified student counts"
          git push
