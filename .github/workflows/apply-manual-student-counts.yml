name: Apply manual student counts

on:
  push:
    branches: [main]
    paths:
      - "data/manual-student-counts-2026-10-03.json"
      - "scripts/apply_manual_student_counts.py"
      - ".github/workflows/apply-manual-student-counts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply manual records and preschool labels
        run: python scripts/apply_manual_student_counts.py
      - name: Commit generated data
        run: |
          if [ -z "$(git status --porcelain -- data/student-overrides.json data/manual-student-counts-summary.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/student-overrides.json data/manual-student-counts-summary.json
          git commit -m "data: apply manual preschool student counts"
          git push
