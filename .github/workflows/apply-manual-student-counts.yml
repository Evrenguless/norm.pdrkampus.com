name: Apply manual student counts

on:
  push:
    branches: [main]
    paths:
      - "data/manual-student-counts-2026-10-03.json"
      - "scripts/apply_manual_student_counts.py"
      - "scripts/patch_manual_review_frontend.py"
      - ".github/workflows/apply-manual-student-counts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch published site views from stored manual review data
        run: python scripts/patch_manual_review_frontend.py
      - name: Commit published site views
        run: |
          if [ -z "$(git status --porcelain -- index.html eksik-veriler.html)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html eksik-veriler.html
          git commit -m "fix: publish manual review state in site UI"
          git push
