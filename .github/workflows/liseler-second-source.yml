name: Liseler second-source scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/scan_liseler_second_source.py"
      - ".github/workflows/liseler-second-source.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Scan liseler.com.tr
        run: python scripts/scan_liseler_second_source.py
      - name: Commit results
        run: |
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/student-overrides.json data/liseler-com-tr-second-pass.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: recover high-school counts from liseler.com.tr"
          git push
