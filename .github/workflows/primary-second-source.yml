name: Primary second-source scan

on:
  push:
    branches: [main]
    paths:
      - "scripts/scan_primary_second_source.py"
      - "data/student-scan-summary.json"
      - ".github/workflows/primary-second-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Scan remaining primary schools
        run: python scripts/scan_primary_second_source.py
      - name: Commit recovered counts
        run: |
          if [ -z "$(git status --porcelain -- data/student-overrides.json data/primary-second-source-summary.json)" ]; then
            echo "No second-source updates."
            exit 0
          fi
          git config user.name "pdrkampus-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/student-overrides.json data/primary-second-source-summary.json
          git commit -m "data: add primary second-source student counts"
          git push
