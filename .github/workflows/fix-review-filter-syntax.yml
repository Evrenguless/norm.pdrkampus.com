name: Fix review page JavaScript
on:
  push:
    paths:
      - '.github/workflows/fix-review-filter-syntax.yml'
      - 'scripts/fix_review_filter_syntax.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair filter syntax
        run: python scripts/fix_review_filter_syntax.py
      - name: Extract and validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('eksik-veriler.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          assert a >= 0 and b > a
          Path('/tmp/review.js').write_text(s[a+8:b], encoding='utf-8')
          PY
          node --check /tmp/review.js
      - name: Commit repaired page
        run: |
          git config user.name 'pdrkampus-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add eksik-veriler.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair unresolved review page JavaScript'
          git push origin HEAD:main
