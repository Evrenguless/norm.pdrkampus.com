name: Migrate liseler overrides

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_liseler_override_schema.py
      - .github/workflows/migrate-liseler-overrides.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate liseler.com.tr override fields
        run: python scripts/migrate_liseler_override_schema.py
      - name: Commit migrated overrides
        run: |
          if git diff --quiet -- data/student-overrides.json; then
            echo "No migration needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/student-overrides.json
          git commit -m "fix: expose liseler student counts to site"
          git push
