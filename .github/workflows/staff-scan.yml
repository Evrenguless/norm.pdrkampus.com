name: Collect public school counselor listings
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: school-staff-scan
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STAFF_WORK_DIR: work/staff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==5.3.2
      - name: Resume public roster scan
        run: python tools/collect-staff.py --workers 16
      - name: Export aggregate counts
        run: python tools/export-staff.py
      - name: Save completed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/staff-v1.json data/staff-v1.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Complete public school counselor roster scan'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save scan audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-scan-audit
          path: work/staff/staff-crawl.sqlite
          retention-days: 7
